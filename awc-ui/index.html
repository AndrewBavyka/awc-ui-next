<style>
  .problematic-host {
    width: 200px;
    height: 100px;
    overflow: hidden;
    border: 1px solid red;
    position: absolute;
    top: 50px;
    left: 50px;
  }

  body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
  }
</style>

<body>
  <form>
   <awc-select
  input-placeholder="Поиск"
  autoselect-off=""
  search=""
  custom-error=""
  name="select"
  placeholder="Выберите продукт"
>
  <awc-select-item value="Аспро.Cloud">
    <awc-avatar
      size="32"
      rounded="circle"
      status="none"
      color="global-red-2-600"
      icon="none"
      title="Аспро.Cloud"
    ></awc-avatar>
    Аспро.Cloud
  </awc-select-item>
  <awc-select-item value="Аспро.Agile">Аспро.Тайм-трекер</awc-select-item>
  <awc-select-group label="Группа">
    <awc-select-item value="Аспро.Agile">Аспро.Agile</awc-select-item>
    <awc-select-item value="Аспро.Телефония">Аспро.Телефония</awc-select-item>
    <awc-select-item value="Аспро.CRM">Аспро.CRM</awc-select-item>
  </awc-select-group>
  <awc-select-item value="Аспро.Финансы">Аспро.Финансы</awc-select-item>
  <awc-select-group label="Группа 2">
    <awc-select-item value="Аспро.Agile">Аспро.Agile</awc-select-item>
    <awc-select-item value="Аспро.Телефония">Аспро.Телефония</awc-select-item>
    <awc-select-item value="Аспро.CRM">Аспро.CRM</awc-select-item>
  </awc-select-group>
  <awc-select-button
    dynamic-button=""
    slot="awc-button"
    icon=""
    label="Создать"
  ></awc-select-button>
</awc-select>


    

    <awc-button size="regular" variant="primary" type="submit">
      Отправить
    </awc-button>
    <awc-button background="red" size="regular" variant="primary" type="reset">
      Сбросить
    </awc-button>
  </form>
